
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krakem AI - Educational Assistant</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2ff;
  padding: 20px;
}
.container {
  max-width: 700px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #ccc;
}
h1 { color: #2563eb; text-align: center; }
select, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  font-size: 16px;
  box-sizing: border-box;
}
textarea { height: 120px; }
button {
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
#answer {
  background: #eff6ff;
  padding: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
  min-height: 60px;
}
</style>
</head>
<body>
<div class="container">
<h1>🎓 Krakem AI</h1>
<p>Your educational assistant for all levels.</p>

<label>Education level</label>
<select id="level">
<option>Primary School</option>
<option>Secondary School</option>
<option>College</option>
<option>University</option>
</select>

<label>Subject</label>
<select id="subject">
<option>Mathematics</option>
<option>Science</option>
<option>English</option>
<option>History</option>
<option>Computer Studies</option>
<option>Commercial Law</option>
<option>Other</option>
</select>

<label>Your question</label>
<textarea id="question" placeholder="Ask Krakem AI anything educational..."></textarea>

<button id="askButton" onclick="getAnswer()">Ask Krakem AI</button>

<h3>AI Answer</h3>
<div id="answer">Your answer will appear here.</div>
</div>

<script>
async function getAnswer() {
  const question = document.getElementById("question").value.trim();
  const level = document.getElementById("level").value;
  const subject = document.getElementById("subject").value;
  const answer = document.getElementById("answer");
  const button = document.getElementById("askButton");

  if (!question) {
    answer.textContent = "Please enter a question first.";
    return;
  }

  button.disabled = true;
  answer.textContent = "Krakem AI is thinking...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, level, subject})
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    answer.textContent = data.answer || "No answer received.";

  } catch (error) {
    answer.textContent = "Error: " + error.message;
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
